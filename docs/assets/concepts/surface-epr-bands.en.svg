<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-labelledby="title desc">
  <title id="title">MA, MS and SA interfaces, and the bands and rows of the pad's top face</title>
  <desc id="desc">Top: a cross-section at the SimplePad's gap. The metal-air interface MA covers the top and side walls of the ground metal and the pad, the metal-substrate interface MS lies under the metal, and the substrate-air interface SA is the bare silicon in the gap. Bottom: the pad's top face seen from above, near one gap edge. Margins of 0.5 and 1.0 micrometres cut it into band 0 (0 to 0.5 micrometres from the gap edge, 399 square micrometres), band 1 (0.5 to 1.0, 397 square micrometres) and band 2 (beyond 1.0, 39,204 square micrometres). The whole-surface row covers all three bands, the 0.5 micrometre margin row bands 1 and 2, and the 1.0 micrometre margin row band 2 only.</desc>
  <rect width="760" height="600" fill="#ffffff"/>
  <text x="20" y="34" font-family="sans-serif" font-size="20" font-weight="700" fill="#172554">Surfaces, bands and rows of the SimplePad</text>
  <text x="20" y="58" font-family="sans-serif" font-size="13" fill="#475569">Route B · margins 0.5 and 1.0 µm · not to scale</text>

  <!-- Panel 1: the three interfaces -->
  <g transform="translate(0,76)">
    <rect x="20" y="0" width="720" height="200" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="36" y="24" font-family="sans-serif" font-size="16" font-weight="700" fill="#172554">Where MA, MS and SA are</text>
    <text x="36" y="44" font-family="sans-serif" font-size="13" fill="#475569">Cross-section at the gap between the ground metal and the pad</text>
    <rect x="40" y="56" width="440" height="78" fill="#eef5fd"/>
    <text x="52" y="76" font-family="sans-serif" font-size="13" fill="#38536b">vacuum</text>
    <rect x="40" y="110" width="160" height="24" fill="#8a96a8"/>
    <rect x="300" y="110" width="180" height="24" fill="#8a96a8"/>
    <text x="120" y="127" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffffff">ground</text>
    <text x="390" y="127" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffffff">pad</text>
    <text x="250" y="104" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">gap</text>
    <rect x="40" y="134" width="440" height="50" fill="#dce9f4"/>
    <text x="52" y="168" font-family="sans-serif" font-size="13" fill="#38536b">Si substrate</text>
    <polyline points="40,110 200,110 200,134" fill="none" stroke="#d9822b" stroke-width="4"/>
    <polyline points="480,110 300,110 300,134" fill="none" stroke="#d9822b" stroke-width="4"/>
    <line x1="40" y1="136" x2="200" y2="136" stroke="#7b5ea7" stroke-width="4"/>
    <line x1="300" y1="136" x2="480" y2="136" stroke="#7b5ea7" stroke-width="4"/>
    <line x1="202" y1="136" x2="298" y2="136" stroke="#4c9a5f" stroke-width="4"/>
    <rect x="500" y="70" width="14" height="14" fill="#d9822b"/>
    <text x="522" y="82" font-family="sans-serif" font-size="13" fill="#334155">MA, metal–air: top and</text>
    <text x="522" y="99" font-family="sans-serif" font-size="13" fill="#334155">side walls of the metal</text>
    <rect x="500" y="114" width="14" height="14" fill="#7b5ea7"/>
    <text x="522" y="126" font-family="sans-serif" font-size="13" fill="#334155">MS, metal–substrate:</text>
    <text x="522" y="143" font-family="sans-serif" font-size="13" fill="#334155">under the metal</text>
    <rect x="500" y="158" width="14" height="14" fill="#4c9a5f"/>
    <text x="522" y="170" font-family="sans-serif" font-size="13" fill="#334155">SA, substrate–air:</text>
    <text x="522" y="187" font-family="sans-serif" font-size="13" fill="#334155">bare silicon in the gap</text>
  </g>

  <!-- Panel 2: bands and rows -->
  <g transform="translate(0,288)">
    <rect x="20" y="0" width="720" height="300" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="36" y="24" font-family="sans-serif" font-size="16" font-weight="700" fill="#172554">Bands and rows of the pad's top face</text>
    <text x="36" y="44" font-family="sans-serif" font-size="13" fill="#475569">Seen from above, near one gap edge; the pad's centre is 100 µm from each edge</text>
    <rect x="30" y="60" width="30" height="56" fill="#e7f2ea"/>
    <text x="45" y="92" transform="rotate(-90 45 88)" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">gap</text>
    <rect x="60" y="60" width="120" height="56" fill="#f2c79b"/>
    <rect x="180" y="60" width="120" height="56" fill="#f7dcc0"/>
    <rect x="300" y="60" width="400" height="56" fill="#fbeee0"/>
    <line x1="60" y1="56" x2="60" y2="120" stroke="#172554" stroke-width="3"/>
    <text x="120" y="93" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#334155">band 0</text>
    <text x="240" y="93" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#334155">band 1</text>
    <text x="400" y="93" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#334155">band 2</text>
    <text x="560" y="93" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#334155">…</text>
    <text x="60" y="134" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">0</text>
    <text x="180" y="134" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">0.5</text>
    <text x="300" y="134" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">1.0 µm from the gap edge</text>
    <text x="120" y="152" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">399 µm²</text>
    <text x="240" y="152" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">397 µm²</text>
    <text x="500" y="152" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">39,204 µm²</text>
    <text x="60" y="180" font-family="sans-serif" font-size="13" fill="#334155">Whole-surface row: bands 0, 1 and 2 · 40,000 µm²</text>
    <rect x="60" y="186" width="640" height="14" fill="#d9822b"/>
    <text x="180" y="224" font-family="sans-serif" font-size="13" fill="#334155">Margin 0.5 µm row: bands 1 and 2 · 39,601 µm²</text>
    <rect x="180" y="230" width="520" height="14" fill="#d9822b" fill-opacity="0.7"/>
    <text x="300" y="268" font-family="sans-serif" font-size="13" fill="#334155">Margin 1.0 µm row: band 2 · 39,204 µm²</text>
    <rect x="300" y="274" width="400" height="14" fill="#d9822b" fill-opacity="0.45"/>
  </g>
</svg>
