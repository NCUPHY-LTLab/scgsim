[build-system]
requires = ["setuptools>=77"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "scgsim"
version = "2.0.0rc15"
description = "Research-first electromagnetic simulation workflows for superconducting circuits."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0.0",
    "plotly>=6.0.0",
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/gsim-LICENSE.txt"]

[project.optional-dependencies]
aedt = [
    "gdstk",
    "pyaedt==1.3.0",
    "shapely==2.1.2",
]
aedt-epr = [
    "gdstk",
    "pyaedt==1.3.0",
    "shapely==2.1.2",
    "gdsfactory>=9,<10",
    "klayout>=0.30,<0.31",
]
palace = [
    "gdsfactory>=9,<10",
    "gdstk",
    "gmsh",
    "shapely==2.1.2",
]
visualization = [
    "meshio>=5.3,<6",
    "pillow>=11,<13",
    "pyvista[jupyter]>=0.48,<0.49",
]

[project.urls]
Issues = "https://github.com/NCUPHY-LTLab/scgsim/issues"
Homepage = "https://github.com/OrPenStrike/scgsim"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["scgsim._agent_knowledge*"]

[tool.setuptools.package-data]
scgsim = [
    "_agent_knowledge/manifest.json",
    "_agent_knowledge/README.md",
    "_agent_knowledge/docs/*.qmd",
    "_agent_knowledge/docs/**/*.qmd",
    "_agent_knowledge/docs/assets/*",
    "_agent_knowledge/docs/assets/**/*",
    "geometry/sgb/sidecar/*.json",
]

[dependency-groups]
test = [
    "pytest",
    "ipython",
    "setuptools>=77",
    "jsonschema>=4,<5",
]
occt = [
    "cadquery-ocp-novtk==7.8.1.1.post1",
]
quality = [
    "ruff==0.17.3",
    "pyright[nodejs]==1.1.411",
    "nodejs-wheel-binaries>=22,<23",
    "import-linter==2.15",
]
# Everything a contributor needs, the same set the full CI test job installs: `uv sync --group dev`.
dev = [
    "scgsim[aedt-epr,palace,visualization]",
    { include-group = "test" },
    { include-group = "quality" },
    { include-group = "occt" },
]

[tool.uv]
# A plain `uv sync` installs the package alone; uv would otherwise add the `dev` group by default.
default-groups = []

[tool.pyright]
include = ["src"]
strict = [
    "src/scgsim/aedt/epr/evidence.py",
    "src/scgsim/aedt/runtime/batch_protocol.py",
    "src/scgsim/aedt/runtime/batch_runner.py",
]
typeCheckingMode = "standard"
extraPaths = ["src", "src/scgsim/aedt/runtime"]

[tool.pytest.ini_options]
markers = [
    "private_golden: owner-authorized external returned-data fixtures; explicit manifest required; excluded from public CI",
    "slow: multi-second tests (worker-process and large random layouts); deselect with -m 'not slow'",
    "occt: official OpenCASCADE checks through OCP (dependency group `occt`); skipped when OCP is not installed",
]
