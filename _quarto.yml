project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - docs/*.qmd
    - docs/specs/*.qmd
    - docs/course/*.qmd
    - docs/tutorials/*.qmd
    - docs/tutorials/*/*.qmd
    - docs/concepts/*.qmd

execute:
  enabled: false

website:
  title: "SCGSim"
  description: "Source geometry, explicit solver handoffs and verified electromagnetic results"
  page-navigation: true
  search:
    location: navbar
    type: overlay
  repo-url: https://github.com/OrPenStrike/scgsim
  repo-actions: [source, issue]
  page-footer:
    right:
      - text: "Maintainer guide"
        href: docs/ownership.qmd
  navbar:
    left:
      - text: "Overview"
        href: index.qmd
      - text: "Tutorials"
        href: docs/examples.qmd
      - text: "Concepts"
        href: docs/concepts/problems.qmd
      - text: "Reference"
        href: docs/backend-support.qmd
  sidebar:
    - id: overview
      title: "Pages"
      style: floating
      collapse-level: 1
      contents:
        - text: "SCGSim overview"
          href: index.qmd
    - id: tutorials
      title: "Pages"
      style: floating
      collapse-level: 1
      contents:
        - docs/examples.qmd
        - section: "Tutorials"
          contents:
            - docs/course/installation.qmd
            - docs/tutorials/simplepad-model.qmd
            - section: "Pad capacitance"
              contents:
                - text: "1. Prepare"
                  href: docs/tutorials/capacitance/prepare.qmd
                - text: "2. Run"
                  href: docs/tutorials/capacitance/run.qmd
                - text: "3. Analyze"
                  href: docs/tutorials/capacitance/analyze.qmd
            - section: "Resonance and EPR"
              contents:
                - text: "1. Prepare"
                  href: docs/tutorials/resonance-epr/prepare.qmd
                - text: "2. Run"
                  href: docs/tutorials/resonance-epr/run.qmd
                - text: "3. Analyze"
                  href: docs/tutorials/resonance-epr/analyze.qmd
        - section: "Your own model"
          contents:
            - docs/course/working-model.qmd
            - docs/course/source-observations.qmd
            - docs/course/solver-observations.qmd
            - docs/course/execute.qmd
            - docs/course/returned-results.qmd
        - section: "Palace"
          contents:
            - docs/course/palace-electrostatic.qmd
            - docs/course/palace-eigenmode.qmd
        - section: "AEDT"
          contents:
            - docs/course/aedt-inputs.qmd
            - docs/course/aedt-eigenmode.qmd
            - docs/course/aedt-driven-modal.qmd
            - docs/course/aedt-driven-terminal.qmd
            - docs/course/aedt-q3d.qmd
            - docs/course/aedt-q2d.qmd
        - section: "EPR after the run"
          contents:
            - docs/course/aedt-saved-fields.qmd
            - docs/course/offline-epr.qmd
        - section: "Example: flip-chip Xmon"
          contents:
            - docs/tutorial-xmon-input.qmd
            - docs/tutorial-xmon-palace.qmd
            - docs/tutorial-xmon-aedt.qmd
    - id: concepts
      title: "Pages"
      style: floating
      collapse-level: 1
      contents:
        - docs/concepts/problems.qmd
        - docs/concepts/geometry.qmd
        - docs/eigenmode-epr.qmd
        - docs/concepts/model-and-numerics.qmd
    - id: reference
      title: "Pages"
      style: floating
      collapse-level: 1
      contents:
        - docs/backend-support.qmd
        - section: "Geometry"
          contents:
            - docs/geometry-sgb.qmd
            - docs/specs/physical-representation.qmd
            - docs/specs/material-realization.qmd
        - section: "Palace"
          contents:
            - docs/specs/palace-electrostatic-sgb.qmd
            - docs/specs/palace-eigenmode.qmd
            - docs/mesh-quality.qmd
        - section: "AEDT"
          contents:
            - docs/specs/aedt-runtime.qmd
        - section: "Running and results"
          contents:
            - docs/execution-profiles.qmd
            - docs/geometry-preview.qmd
            - docs/report-model.qmd
            - docs/notebook-ux.qmd
            - docs/api-migration.qmd
    - id: maintainer
      title: "Maintainer pages"
      style: floating
      collapse-level: 1
      contents:
        - docs/ownership.qmd
        - docs/architecture.qmd
        - docs/provenance.qmd
        - docs/goals-and-upstream.qmd
        - docs/roadmap.qmd
        - docs/errors.qmd

format:
  askr-html:
    html-math-method: mathjax
    respect-user-color-scheme: true
    toc: true
    toc-title: "Sections"
    toc-location: right
    page-layout: article
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
