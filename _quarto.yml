execute:
  enabled: false
website:
  title: SCGSim
  description: Prepare electromagnetic simulations of superconducting circuits and
    analyze the returned results.
  page-navigation: true
  search:
    location: navbar
    type: overlay
  repo-url: https://github.com/NCUPHY-LTLab/scgsim
  repo-actions:
  - source
  - issue
  page-footer:
    left:
    - text: Apache-2.0
      href: LICENSE
    - text: Third-party notices
      href: NOTICE
    right:
    - text: Contributing
      href: docs/contributing.qmd
  navbar:
    left:
    - text: Overview
      href: index.qmd
    - text: Tutorials
      href: docs/examples.qmd
    - text: Concepts
      href: docs/concepts/problems.qmd
    - text: Reference
      href: docs/backend-support.qmd
    - text: Contributing
      href: docs/contributing.qmd
    tools-collapse: false
    tools:
    - icon: github
      href: https://github.com/NCUPHY-LTLab/scgsim
      text: GitHub repository
      aria-label: GitHub repository
  sidebar:
  - id: overview
    title: Pages
    style: floating
    collapse-level: 1
    contents:
    - text: SCGSim overview
      href: index.qmd
  - id: tutorials
    title: Pages
    style: floating
    collapse-level: 1
    contents:
    - docs/examples.qmd
    - section: Tutorials
      contents:
      - docs/course/installation.qmd
      - docs/tutorials/simplepad-model.qmd
      - section: Pad capacitance
        contents:
        - text: 1. Prepare
          href: docs/tutorials/capacitance/prepare.qmd
        - text: 2. Run
          href: docs/tutorials/capacitance/run.qmd
        - text: 3. Analyze
          href: docs/tutorials/capacitance/analyze.qmd
      - section: Resonance and EPR
        contents:
        - text: 1. Prepare
          href: docs/tutorials/resonance-epr/prepare.qmd
        - text: 2. Run
          href: docs/tutorials/resonance-epr/run.qmd
        - text: 3. Analyze
          href: docs/tutorials/resonance-epr/analyze.qmd
    - section: Your own model
      contents:
      - docs/course/working-model.qmd
      - docs/course/source-observations.qmd
      - docs/course/solver-observations.qmd
      - docs/course/execute.qmd
      - docs/course/returned-results.qmd
    - section: Palace
      contents:
      - docs/course/palace-electrostatic.qmd
      - docs/course/palace-eigenmode.qmd
    - section: AEDT
      contents:
      - docs/course/aedt-inputs.qmd
      - docs/course/aedt-eigenmode.qmd
      - docs/course/aedt-driven-modal.qmd
      - docs/course/aedt-driven-terminal.qmd
      - docs/course/aedt-q3d.qmd
      - docs/course/aedt-q2d.qmd
    - section: EPR after the run
      contents:
      - docs/course/aedt-saved-fields.qmd
      - docs/course/offline-epr.qmd
    - section: 'Example: flip-chip Xmon'
      contents:
      - docs/tutorial-xmon-input.qmd
      - docs/tutorial-xmon-palace.qmd
      - docs/tutorial-xmon-aedt.qmd
  - id: concepts
    title: Pages
    style: floating
    collapse-level: 1
    contents:
    - docs/concepts/problems.qmd
    - docs/concepts/geometry.qmd
    - docs/eigenmode-epr.qmd
    - docs/concepts/model-and-numerics.qmd
    - section: SGB method chapters
      contents:
      - docs/concepts/sgb/cad-mesh.qmd
      - docs/concepts/sgb/curved-construction.qmd
      - docs/concepts/sgb/performance.qmd
      - docs/concepts/sgb/physical-model.qmd
      - docs/concepts/sgb/planar-arrangement.qmd
      - docs/concepts/sgb/polygon-construction.qmd
      - docs/concepts/sgb/shared-topology.qmd
      - docs/concepts/sgb/sources.qmd
      - docs/concepts/sgb/validation.qmd
  - id: reference
    title: Pages
    style: floating
    collapse-level: 1
    contents:
    - docs/reference.qmd
    - docs/backend-support.qmd
    - section: Geometry
      contents:
      - docs/geometry-sgb.qmd
      - docs/specs/physical-representation.qmd
      - docs/specs/material-realization.qmd
    - section: Palace
      contents:
      - docs/specs/palace-electrostatic-sgb.qmd
      - docs/specs/palace-eigenmode.qmd
      - docs/mesh-quality.qmd
    - section: AEDT
      contents:
      - docs/specs/aedt-runtime.qmd
    - section: Running and results
      contents:
      - docs/execution-profiles.qmd
      - docs/geometry-preview.qmd
      - docs/report-model.qmd
      - docs/notebook-ux.qmd
      - docs/api-migration.qmd
  - id: contribution
    title: Pages
    style: floating
    collapse-level: 1
    contents:
    - docs/contributing.qmd
    - docs/ownership.qmd
    - docs/architecture.qmd
    - docs/provenance.qmd
    - docs/goals-and-upstream.qmd
    - docs/roadmap.qmd
    - docs/errors.qmd
    - docs/documentation-map.qmd
    - docs/convergence-status.qmd
    - section: Historical examples
      contents:
      - docs/course/palace-surface-bands.qmd
      - docs/history/aedt-capacitance-pre-v3.qmd
      - docs/history/curved-source-installation.qmd
      - docs/history/sgb-geometric-bands.qmd
      - docs/history/simplepad-eigenmode-200nm.qmd
      - docs/history/simplepad-epr-200nm.qmd
    - section: Other worked examples
      contents:
      - docs/course/aedt-eigenmode-epr.qmd
      - docs/course/aedt-hpc-sweep.qmd
      - docs/tutorials/eigenmode/analyze.qmd
      - docs/tutorials/eigenmode/prepare-handoff.qmd
      - docs/tutorials/eigenmode/run-directly.qmd
      - docs/tutorials/resonance.qmd
      - docs/tutorials/scattering.qmd
      - docs/tutorials/transmission-line.qmd
  repo-branch: codex/sgb-method-performance
format:
  askr-html:
    html-math-method: mathjax
    respect-user-color-scheme: true
    toc: true
    toc-title: Sections
    toc-location: right
    page-layout: article
    code-copy: true
    code-overflow: scroll
    smooth-scroll: true
lang: en
askr:
  languages:
    current: en
    items:
    - code: en
      label: English
      href: /
    - code: zh-TW
      label: 繁體中文
      href: /zh-TW/
