format:
  askr-html:
    html-math-method: mathjax
    respect-user-color-scheme: true
    toc: true
    toc-title: 本頁章節
    toc-location: right
    page-layout: article
    code-copy: true
    code-overflow: scroll
    smooth-scroll: true
lang: zh-TW
askr:
  languages:
    current: zh-TW
    items:
    - code: en
      label: English
      href: /
    - code: zh-TW
      label: 繁體中文
      href: /zh-TW/
