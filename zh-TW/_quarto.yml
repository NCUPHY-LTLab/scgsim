project:
  type: website
  output-dir: ../_site/zh-TW
  resources:
  - askr-versions.json
  - MAINTAINING.md
  - docs/contribute/sgb-design/figures/plotly.min.js
  render:
  - index.qmd
  - docs/start/*.qmd
  - docs/guides/*.qmd
  - docs/guides/xmon/*.qmd
  - docs/concepts/*.qmd
  - docs/reference/*.qmd
  - docs/reference/api/*.qmd
  - docs/reference/specs/*.qmd
  - docs/contribute/*.qmd
  - docs/contribute/research/*.qmd
  - docs/contribute/research/*/*.qmd
  - docs/contribute/history/*.qmd
  - docs/contribute/sgb-design/*.qmd
execute:
  enabled: false
lang: zh-TW
askr:
  languages:
    current: zh-TW
    items:
    - code: en
      label: English
      href: /
    - code: zh-TW
      label: 繁體中文
      href: /zh-TW/
website:
  title: SCGSim
  description: 從具名版圖、材料與物理模型，準備求解器輸入並解讀電磁計算結果。
  page-navigation: true
  search:
    location: navbar
    type: overlay
  repo-url: https://github.com/NCUPHY-LTLab/scgsim
  repo-actions:
  - source
  - issue
  page-footer:
    right:
    - text: 貢獻
      href: docs/contribute/index.qmd
    left:
    - icon: github
      aria-label: GitHub 原始碼
      href: https://github.com/NCUPHY-LTLab/scgsim
  navbar:
    left:
    - text: 開始
      href: index.qmd
    - text: 使用指南
      href: docs/guides/prepare-a-layout.qmd
    - text: 概念
      href: docs/concepts/problems.qmd
    - text: 參考
      href: docs/reference/index.qmd
    - text: 貢獻
      href: docs/contribute/index.qmd
    tools-collapse: false
    tools:
    - icon: github
      href: https://github.com/NCUPHY-LTLab/scgsim
      text: GitHub 原始碼
      aria-label: GitHub 原始碼
  sidebar:
  - id: start
    title: 頁面
    style: floating
    collapse-level: 1
    contents:
    - text: 首頁
      href: index.qmd
    - docs/start/install.qmd
    - docs/start/first-simulation.qmd
    - docs/start/choose-a-simulation.qmd
  - id: guides
    title: 頁面
    style: floating
    collapse-level: 1
    contents:
    - section: 準備與檢查
      contents:
      - docs/guides/prepare-a-layout.qmd
      - docs/guides/check-a-layout.qmd
      - docs/guides/inspect-the-source.qmd
      - docs/guides/inspect-the-prepared-model.qmd
      - docs/guides/preview-the-geometry.qmd
    - section: 計算
      contents:
      - docs/guides/capacitance-palace.qmd
      - docs/guides/capacitance-q3d.qmd
      - docs/guides/modes-palace.qmd
      - docs/guides/aedt-cpw-inputs.qmd
      - docs/guides/modes-hfss.qmd
      - docs/guides/s-parameters-hfss.qmd
      - docs/guides/line-parameters-q2d.qmd
    - section: 結果
      contents:
      - docs/guides/convergence-and-reports.qmd
    - section: 在其他電腦執行
      contents:
      - docs/guides/run-elsewhere.qmd
      - docs/guides/hpc-sweep.qmd
    - section: 執行之後
      contents:
      - docs/guides/saved-fields.qmd
      - docs/guides/offline-loss.qmd
    - section: 完整範例：覆晶 Xmon
      contents:
      - docs/guides/xmon/inputs.qmd
      - docs/guides/xmon/palace.qmd
      - docs/guides/xmon/aedt.qmd
    - section: 升級
      contents:
      - docs/guides/upgrade.qmd
  - id: concepts
    title: 頁面
    style: floating
    collapse-level: 1
    contents:
    - docs/concepts/problems.qmd
    - docs/concepts/geometry.qmd
    - docs/concepts/surface-epr.qmd
    - docs/concepts/model-and-numerics.qmd
  - id: reference
    title: 頁面
    style: floating
    collapse-level: 1
    contents:
    - docs/reference/index.qmd
    - docs/reference/supported-calculations.qmd
    - docs/reference/supported-scope.qmd
    - docs/reference/supported-geometry.qmd
    - docs/reference/known-geometry-problems.qmd
    - docs/reference/terms-and-units.qmd
    - docs/reference/api-index.qmd
    - docs/reference/api/analyze-epr.qmd
    - section: 詳細規格
      contents:
      - docs/reference/specs/geometry-plan.qmd
      - docs/reference/specs/physical-representation.qmd
      - docs/reference/specs/palace-electrostatic-sgb.qmd
      - docs/reference/specs/palace-eigenmode.qmd
      - docs/reference/specs/aedt-runtime.qmd
      - docs/reference/specs/execution-profiles.qmd
      - docs/reference/specs/mesh-quality.qmd
      - docs/reference/specs/report-model.qmd
  - id: contribute
    title: 頁面
    style: floating
    collapse-level: 1
    contents:
    - docs/contribute/index.qmd
    - docs/contribute/code-map.qmd
    - docs/contribute/architecture.qmd
    - docs/contribute/ownership.qmd
    - docs/contribute/documentation-map.qmd
    - docs/contribute/goals-and-upstream.qmd
    - docs/contribute/provenance.qmd
    - docs/contribute/notebook-contract.qmd
    - section: 研究
      contents:
      - docs/contribute/research/index.qmd
      - section: 幾何建構效能
        contents:
        - docs/contribute/research/geometry-build/index.qmd
        - docs/contribute/research/geometry-build/scaling.qmd
        - docs/contribute/research/geometry-build/emission-and-load.qmd
        - docs/contribute/research/geometry-build/validation-cost.qmd
        - docs/contribute/research/geometry-build/reproduction.qmd
    - section: 歷史
      contents:
      - docs/contribute/history/aedt-capacitance-pre-v3.qmd
      - docs/contribute/history/curved-source-installation.qmd
    - section: SGB 設計
      contents:
      - docs/contribute/sgb-design/index.qmd
      - docs/contribute/sgb-design/why-plan-first.qmd
      - docs/contribute/sgb-design/layered-model.qmd
      - docs/contribute/sgb-design/arrangement.qmd
      - docs/contribute/sgb-design/labels-and-dissolution.qmd
      - docs/contribute/sgb-design/assembly.qmd
      - docs/contribute/sgb-design/routes.qmd
      - docs/contribute/sgb-design/cut-families.qmd
      - docs/contribute/sgb-design/inset-imprint.qmd
      - docs/contribute/sgb-design/identity.qmd
      - docs/contribute/sgb-design/slivers.qmd
      - docs/contribute/sgb-design/validation.qmd
      - docs/contribute/sgb-design/emission.qmd
      - docs/contribute/sgb-design/brep-format.qmd
      - docs/contribute/sgb-design/consumer-contract.qmd
      - docs/contribute/sgb-design/consumer-mapping.qmd
      - docs/contribute/sgb-design/pipeline-reference.qmd
      - docs/contribute/sgb-design/decisions.qmd
format:
  askr-html:
    html-math-method: mathjax
    respect-user-color-scheme: true
    toc: true
    toc-title: 本頁章節
    toc-location: right
    page-layout: article
    code-copy: true
    code-overflow: scroll
    smooth-scroll: true
