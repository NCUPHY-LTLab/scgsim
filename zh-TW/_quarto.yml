website:
  title: SCGSim
  description: 準備超導電路的電磁模擬，並分析求解器回傳的結果。
  page-navigation: true
  search:
    location: navbar
    type: overlay
  repo-url: https://github.com/NCUPHY-LTLab/scgsim
  repo-actions:
  - source
  - issue
  page-footer:
    left:
    - text: Apache-2.0
      href: LICENSE
    - text: 第三方授權聲明
      href: NOTICE
    right:
    - text: 貢獻
      href: docs/contributing.qmd
  navbar:
    left:
    - text: 總覽
      href: index.qmd
    - text: 教學
      href: docs/examples.qmd
    - text: 概念
      href: docs/concepts/problems.qmd
    - text: 參考
      href: docs/backend-support.qmd
    - text: 貢獻
      href: docs/contributing.qmd
    tools-collapse: false
    tools:
    - icon: github
      href: https://github.com/NCUPHY-LTLab/scgsim
      text: GitHub 原始碼
      aria-label: GitHub 原始碼
  sidebar:
  - id: overview
    title: 頁面
    style: floating
    collapse-level: 1
    contents:
    - text: SCGSim 總覽
      href: index.qmd
  - id: tutorials
    title: 頁面
    style: floating
    collapse-level: 1
    contents:
    - docs/examples.qmd
    - section: 教學
      contents:
      - docs/course/installation.qmd
      - docs/tutorials/simplepad-model.qmd
      - section: 焊墊電容
        contents:
        - text: 1. 準備模擬包
          href: docs/tutorials/capacitance/prepare.qmd
        - text: 2. 執行模擬
          href: docs/tutorials/capacitance/run.qmd
        - text: 3. 分析結果
          href: docs/tutorials/capacitance/analyze.qmd
      - section: 共振與 EPR
        contents:
        - text: 1. 準備模擬包
          href: docs/tutorials/resonance-epr/prepare.qmd
        - text: 2. 執行模擬
          href: docs/tutorials/resonance-epr/run.qmd
        - text: 3. 分析結果
          href: docs/tutorials/resonance-epr/analyze.qmd
    - section: 使用自己的模型
      contents:
