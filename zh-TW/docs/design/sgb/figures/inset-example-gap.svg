<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16">
  <title>例 A：兩條 gap edge 之間的直線 gap，margin 0.5 與 1.0 µm</title>
  <desc>三列分別是寬 1.6、2.0、2.6 µm 的 gap 橫截面，每列兩端的粗黑線是 gap edge。藍色深淺表示 band 0、1、2，實線是要切的 seam，紅色點線是不切的位置。寬 1.6 µm：band 0、1、0，seam 在 0.5 與 1.1 µm。寬 2.0 µm：band 0、1、0，seam 在 0.5 與 1.5 µm，中線 1.0 µm 上距離剛好等於 1.0 µm，但兩側都是 band 1，不切。寬 2.6 µm：band 0、1、2、1、0，seam 在 0.5、1.0、1.6、2.1 µm。</desc>
  <rect width="900" height="430" fill="#ffffff"/>
  <g fill="#111111">
    <text x="20" y="28" font-weight="bold">刻度：距左邊 gap edge 的位置（µm）</text>
  </g>
  <!-- row 1: width 1.6 um, origin x0 = 140 -->
  <g transform="translate(140,60)">
    <rect x="0" y="0" width="100" height="60" fill="#c6dbef"/>
    <rect x="100" y="0" width="120" height="60" fill="#6baed6"/>
    <rect x="220" y="0" width="100" height="60" fill="#c6dbef"/>
    <line x1="0" y1="-6" x2="0" y2="66" stroke="#111111" stroke-width="5"/>
    <line x1="320" y1="-6" x2="320" y2="66" stroke="#111111" stroke-width="5"/>
    <g stroke="#111111" stroke-width="2"><line x1="100" y1="0" x2="100" y2="60"/><line x1="220" y1="0" x2="220" y2="60"/></g>
    <g fill="#111111" text-anchor="middle">
      <text x="50" y="35">0</text><text x="160" y="35">1</text><text x="270" y="35">0</text>
      <text x="0" y="82">0</text><text x="100" y="82">0.5</text><text x="220" y="82">1.1</text><text x="320" y="82">1.6</text>
    </g>
    <text x="-125" y="35" fill="#111111">寬 1.6 µm</text>
    <text x="345" y="25" fill="#111111">gap 中心距離 0.8 µm &lt; 1.0 µm：沒有 band 2，</text>
    <text x="345" y="43" fill="#111111">也沒有 1.0 µm 的 seam</text>
  </g>
  <!-- row 2: width 2.0 um -->
  <g transform="translate(140,170)">
    <rect x="0" y="0" width="100" height="60" fill="#c6dbef"/>
    <rect x="100" y="0" width="200" height="60" fill="#6baed6"/>
    <rect x="300" y="0" width="100" height="60" fill="#c6dbef"/>
    <line x1="0" y1="-6" x2="0" y2="66" stroke="#111111" stroke-width="5"/>
    <line x1="400" y1="-6" x2="400" y2="66" stroke="#111111" stroke-width="5"/>
    <g stroke="#111111" stroke-width="2"><line x1="100" y1="0" x2="100" y2="60"/><line x1="300" y1="0" x2="300" y2="60"/></g>
    <line x1="200" y1="-4" x2="200" y2="64" stroke="#c0392b" stroke-width="2" stroke-dasharray="2,4"/>
    <g fill="#111111" text-anchor="middle">
      <text x="50" y="35">0</text><text x="150" y="35">1</text><text x="250" y="35">1</text><text x="350" y="35">0</text>
      <text x="0" y="82">0</text><text x="100" y="82">0.5</text><text x="200" y="82">1.0</text><text x="300" y="82">1.5</text><text x="400" y="82">2.0</text>
    </g>
    <text x="-125" y="35" fill="#111111">寬 2.0 µm</text>
    <text x="425" y="25" fill="#c0392b">紅色點線：兩條 1.0 µm offset 重合，</text>
    <text x="425" y="43" fill="#c0392b">兩側都是 band 1，不切（只有線上 d = 1.0）</text>
  </g>
  <!-- row 3: width 2.6 um -->
  <g transform="translate(140,280)">
    <rect x="0" y="0" width="100" height="60" fill="#c6dbef"/>
    <rect x="100" y="0" width="100" height="60" fill="#6baed6"/>
    <rect x="200" y="0" width="120" height="60" fill="#2171b5"/>
    <rect x="320" y="0" width="100" height="60" fill="#6baed6"/>
    <rect x="420" y="0" width="100" height="60" fill="#c6dbef"/>
    <line x1="0" y1="-6" x2="0" y2="66" stroke="#111111" stroke-width="5"/>
    <line x1="520" y1="-6" x2="520" y2="66" stroke="#111111" stroke-width="5"/>
    <g stroke="#111111" stroke-width="2">
      <line x1="100" y1="0" x2="100" y2="60"/><line x1="200" y1="0" x2="200" y2="60"/>
      <line x1="320" y1="0" x2="320" y2="60"/><line x1="420" y1="0" x2="420" y2="60"/>
    </g>
    <g fill="#111111" text-anchor="middle">
      <text x="50" y="35">0</text><text x="150" y="35">1</text><text x="260" y="35" fill="#ffffff">2</text><text x="370" y="35">1</text><text x="470" y="35">0</text>
      <text x="0" y="82">0</text><text x="100" y="82">0.5</text><text x="200" y="82">1.0</text><text x="320" y="82">1.6</text><text x="420" y="82">2.1</text><text x="520" y="82">2.6</text>
    </g>
    <text x="-125" y="35" fill="#111111">寬 2.6 µm</text>
    <text x="545" y="25" fill="#111111">中間 0.6 µm 寬的 band 2：</text>
    <text x="545" y="43" fill="#111111">兩條 1.0 µm seam</text>
  </g>
  <g transform="translate(20,388)" fill="#111111">
    <line x1="0" y1="-5" x2="28" y2="-5" stroke="#111111" stroke-width="5"/><text x="36" y="0">gap edge</text>
    <line x1="150" y1="-5" x2="178" y2="-5" stroke="#111111" stroke-width="2"/><text x="186" y="0">切的 seam</text>
    <line x1="300" y1="-5" x2="328" y2="-5" stroke="#c0392b" stroke-width="2" stroke-dasharray="2,4"/><text x="336" y="0">不切的位置</text>
  </g>
  <g transform="translate(20,418)" fill="#111111">
    <rect x="0" y="-14" width="16" height="16" fill="#c6dbef"/><text x="24" y="0">band 0（d &lt; 0.5 µm）</text>
    <rect x="250" y="-14" width="16" height="16" fill="#6baed6"/><text x="274" y="0">band 1（0.5 ≤ d &lt; 1.0 µm）</text>
    <rect x="550" y="-14" width="16" height="16" fill="#2171b5"/><text x="574" y="0">band 2（d ≥ 1.0 µm）</text>
  </g>
</svg>
