<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="19">
  <title>先建 band 區域，再切 seam：四個步驟</title>
  <desc>概念圖。四個方框依序以箭頭相連：一、每個 support 與 margin 建一個小 arrangement，並判斷每個 cell 在哪一側；二、只在不同 band 的 cell 之間放 seam，記錄兩側的 band；三、Imprint 進 level arrangement 後檢查每條 seam 都完整保留；四、以內部點在區域中定位，決定 face 的 band。下方兩張 10 × 10 µm 正方形示意第一步與第二步。</desc>
  <rect width="900" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <g stroke="#333333" stroke-width="1.5" fill="#f4f6fa">
    <rect x="10" y="10" width="420" height="130" rx="8"/>
    <rect x="470" y="10" width="420" height="130" rx="8"/>
    <rect x="470" y="170" width="420" height="130" rx="8"/>
    <rect x="10" y="170" width="420" height="130" rx="8"/>
  </g>
  <g stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="432" y1="75" x2="466" y2="75"/>
    <line x1="680" y1="142" x2="680" y2="166"/>
    <line x1="468" y1="235" x2="434" y2="235"/>
  </g>
  <g fill="#111111">
    <text x="24" y="40" font-weight="bold">1　區域</text>
    <text x="24" y="70">每個 support 與 margin：候選 offset、support</text>
    <text x="24" y="98">邊界、port 邊界組成小 arrangement；</text>
    <text x="24" y="126">每個 cell 取一個樣本，判斷在 R_m 內或外</text>
    <text x="484" y="40" font-weight="bold">2　必要的 seam</text>
    <text x="484" y="70">只保留分隔不同 band 的 edge，記錄兩側</text>
    <text x="484" y="98">的 band；同一 band 之間的 edge 不切</text>
    <text x="484" y="126">（例如寬 2m 的 gap 的中線）</text>
    <text x="484" y="200" font-weight="bold">3　Imprint 與檢查</text>
    <text x="484" y="230">seam 進入 level arrangement；每條 seam</text>
    <text x="484" y="258">必須被帶它 carrier 的 edge 從頭到尾覆蓋，</text>
    <text x="484" y="286">兩側 face 在記錄的 band，否則拒絕</text>
    <text x="24" y="200" font-weight="bold">4　標記</text>
    <text x="24" y="230">face 的內部點先判斷是否在 support 內，</text>
    <text x="24" y="258">再數它落在幾個 R_m 內：</text>
    <text x="24" y="286">那個數就是 face 的 band</text>
  </g>
  <!-- sketches: the 10 x 10 um square, 18 px per um -->
  <g transform="translate(30,330)">
    <rect x="0" y="0" width="180" height="180" fill="#c6dbef" stroke="#111111" stroke-width="4"/>
    <rect x="36" y="36" width="108" height="108" fill="#6baed6"/>
    <rect x="72" y="72" width="36" height="36" fill="#2171b5"/>
    <g stroke="#333333" stroke-width="1.2" stroke-dasharray="3,4">
      <line x1="0" y1="36" x2="180" y2="36"/><line x1="0" y1="144" x2="180" y2="144"/>
      <line x1="36" y1="0" x2="36" y2="180"/><line x1="144" y1="0" x2="144" y2="180"/>
      <line x1="0" y1="72" x2="180" y2="72"/><line x1="0" y1="108" x2="180" y2="108"/>
      <line x1="72" y1="0" x2="72" y2="180"/><line x1="108" y1="0" x2="108" y2="180"/>
    </g>
    <text x="0" y="210" fill="#111111" font-size="17">步驟 1：兩個 margin 的候選 offset（點線）</text>
  </g>
  <g transform="translate(470,330)">
    <rect x="0" y="0" width="180" height="180" fill="#c6dbef" stroke="#111111" stroke-width="4"/>
    <rect x="36" y="36" width="108" height="108" fill="#6baed6" stroke="#111111" stroke-width="2.5"/>
    <rect x="72" y="72" width="36" height="36" fill="#2171b5" stroke="#111111" stroke-width="2.5"/>
    <text x="0" y="210" fill="#111111" font-size="17">步驟 2：只剩兩圈 seam（實線）</text>
    <g font-size="17" fill="#111111">
      <rect x="200" y="10" width="18" height="18" fill="#c6dbef"/><text x="226" y="25">band 0</text>
      <rect x="200" y="42" width="18" height="18" fill="#6baed6"/><text x="226" y="57">band 1</text>
      <rect x="200" y="74" width="18" height="18" fill="#2171b5"/><text x="226" y="89">band 2</text>
      <line x1="200" y1="118" x2="228" y2="118" stroke="#111111" stroke-width="4"/><text x="234" y="124">gap edge</text>
      <line x1="200" y1="150" x2="228" y2="150" stroke="#111111" stroke-width="2.5"/><text x="234" y="156">seam</text>
    </g>
  </g>
</svg>
